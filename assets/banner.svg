<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Berke Erikci - Full-Stack Web and SEO Developer, games and mods on the side">
  <defs>
    <radialGradient id="bg" cx="15%" cy="8%" r="130%">
      <stop offset="0%" stop-color="#1b1040"/>
      <stop offset="55%" stop-color="#0a0a16"/>
      <stop offset="100%" stop-color="#05060c"/>
    </radialGradient>
    <radialGradient id="cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff39a8" stop-opacity="0.34"/>
      <stop offset="70%" stop-color="#ff39a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#b76bff"/>
      <stop offset="100%" stop-color="#ff39a8"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridmask"><rect width="1280" height="320" fill="url(#fade)"/></mask>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#7aa0ff" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)" mask="url(#gridmask)"/>
  <ellipse cx="1050" cy="60" rx="420" ry="300" fill="url(#cyan)"/>
  <ellipse cx="900" cy="360" rx="460" ry="300" fill="url(#pink)"/>

  <!-- name -->
  <text x="70" y="150" font-family="'JetBrains Mono','Courier New',monospace" font-size="74" font-weight="800" letter-spacing="-2">
    <tspan fill="#f3f5ff">BERKE </tspan><tspan fill="url(#name)" filter="url(#glow)">ERİKÇİ</tspan>
  </text>

  <!-- role -->
  <text x="74" y="196" font-family="'JetBrains Mono','Courier New',monospace" font-size="24" font-weight="600" letter-spacing="3" fill="#b9c2ff">// full-stack web &amp; SEO developer</text>

  <!-- chips: main focus solid, side focus dashed -->
  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="22" font-weight="700" fill="#eef1ff">
    <g transform="translate(74,226)">
      <rect width="80" height="42" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#00e5ff" stroke-opacity="0.55" stroke-width="1.5"/>
      <text x="40" y="28" text-anchor="middle">WEB</text>
    </g>
    <g transform="translate(166,226)">
      <rect width="80" height="42" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#00e5ff" stroke-opacity="0.55" stroke-width="1.5"/>
      <text x="40" y="28" text-anchor="middle">SEO</text>
    </g>
    <g transform="translate(258,226)">
      <rect width="120" height="42" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#00e5ff" stroke-opacity="0.55" stroke-width="1.5"/>
      <text x="60" y="28" text-anchor="middle">3D WEB</text>
    </g>
    <g transform="translate(390,226)">
      <rect width="134" height="42" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#00e5ff" stroke-opacity="0.55" stroke-width="1.5"/>
      <text x="67" y="28" text-anchor="middle">DESKTOP</text>
    </g>
    <text x="546" y="254" font-size="22" fill="#5d6493">+</text>
    <g transform="translate(574,226)" fill="#8f97c9">
      <rect width="230" height="42" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-dasharray="5 5"/>
      <text x="115" y="28" text-anchor="middle">GAMES · MODS</text>
    </g>
  </g>

  <!-- corner glyph -->
  <g transform="translate(1150,70)" opacity="0.9">
    <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="none" stroke="url(#name)" stroke-width="2.5" filter="url(#glow)"/>
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="none" stroke="#00e5ff" stroke-opacity="0.6" stroke-width="1.5"/>
  </g>
</svg>
