<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Berke Erikci - Full-Stack Web and SEO Developer. Fast, search-friendly web platforms built end to end. Games and mods on the side.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1430"/>
      <stop offset="60%" stop-color="#090e20"/>
      <stop offset="100%" stop-color="#060914"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0cce6b" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#0cce6b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b9bff"/>
      <stop offset="100%" stop-color="#4fd1c5"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="90%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridmask"><rect width="1280" height="320" fill="url(#fade)"/></mask>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8b9bff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)" mask="url(#gridmask)"/>
  <ellipse cx="1000" cy="120" rx="380" ry="260" fill="url(#glow)"/>
  <ellipse cx="1000" cy="300" rx="300" ry="160" fill="url(#glow2)"/>

  <!-- left: identity -->
